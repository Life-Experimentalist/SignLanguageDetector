{% extends "layout.html" %} 
{% block title %}Sign Language Quiz Demo{% endblock %} 

{% block content %}
<div class="container">
  <h1>Sign Language Quiz Demo</h1>
  <div id="quizContainer">
    <div id="letter" class="letter"></div>
    <div id="result" class="result"></div>
    <div class="video-container">
      <canvas id="videoCanvas" width="640" height="480" class="img-fluid"></canvas>
    </div>
    
    <!-- Settings Panel -->
    <div class="card mt-3 mb-3">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Quiz Settings</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label for="cameraSelect" class="form-label">Select Camera:</label>
              <select id="cameraSelect" class="form-select form-select-sm">
                <option value="">Loading cameras...</option>
              </select>
            </div>
          </div>
          <div class="col-md-8">
            <div class="d-flex gap-2">
              <button id="startButton" class="btn btn-success">Start Demo</button>
              <button id="stopButton" class="btn btn-danger" disabled>Stop Demo</button>
              <button id="backButton" class="btn btn-secondary">Back to Index</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="currentPrediction" class="mt-2 prediction-display">
    Current Prediction: <span id="predictionValue">None</span>
  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  .letter {
    font-size: 6rem;
    margin-bottom: 20px;
    font-weight: bold;
    color: #007bff;
  }
  
  .result {
    font-size: 1.5rem;
    margin-top: 20px;
    min-height: 2rem;
  }
  
  .video-container {
    position: relative;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
  }
  
  .prediction-display {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 8px 15px;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    z-index: 1000;
  }
  
  /* Dark mode adjustments */
  .dark-mode .letter {
    color: #66b2ff;
  }
  
  .dark-mode .prediction-display {
    background-color: rgba(40, 40, 40, 0.8);
    color: #f4f4f9;
  }
  
  .dark-mode .video-container {
    border-color: #555;
  }
</style>
{% endblock %} 

{% block extra_scripts %}
<script>
  const app = window.SignLanguageApp || {};
  const letterDisplay = document.getElementById('letter');
  const resultDisplay = document.getElementById('result');
  const predictionValueDisplay = document.getElementById('predictionValue');
  const videoCanvas = document.getElementById('videoCanvas');
  const startButton = document.getElementById('startButton');
  const stopButton = document.getElementById('stopButton');
  const backButton = document.getElementById('backButton');
  const cameraSelect = document.getElementById('cameraSelect');

  // Get the allowed letters from the server
  const allowedLetters = {{ allowed_letters|tojson }};
  const QUIZ_DURATION = {{ quiz_duration }} || 3;

  let currentLetter = '';
  let lastPrediction = '';
  let lastPredictionTime = null;
  let currentLetterIndex = 0;
  let waitingForNextLetter = false;
  let demoActive = false;

  // Initialize canvas
  if (videoCanvas) {
    app.videoCanvas = videoCanvas;
    app.ctx = videoCanvas.getContext("2d");
  }

  function nextLetter() {
    waitingForNextLetter = false;
    
    // Check if we've gone through all letters
    if (currentLetterIndex >= allowedLetters.length) {
      letterDisplay.textContent = "Demo Finished";
      resultDisplay.textContent = "You've completed all letters!";
      return;
    }
    
    // Set the current letter and increment index for next time
    currentLetter = allowedLetters[currentLetterIndex];
    currentLetterIndex++;
    
    // Update the display
    letterDisplay.textContent = currentLetter;
    resultDisplay.textContent = "";
    
    // Reset prediction tracking
    lastPrediction = "";
    lastPredictionTime = null;
  }

  function handlePrediction(prediction) {
    if (!demoActive) return;
    
    predictionValueDisplay.textContent = prediction || "None";
    
    // Don't process predictions if we're waiting for the next letter or quiz is finished
    if (waitingForNextLetter || currentLetterIndex > allowedLetters.length) {
      return;
    }
    
    if (prediction === currentLetter) {
      if (lastPrediction !== prediction) {
        // First correct prediction - start the timer
        lastPrediction = prediction;
        lastPredictionTime = new Date().getTime();
        resultDisplay.textContent = "Hold this position...";
      } else {
        // Continuing correct prediction - check if enough time has passed
        const now = new Date().getTime();
        if (now - lastPredictionTime >= QUIZ_DURATION * 1000) {
          resultDisplay.innerHTML = '<span class="text-success">Correct!</span>';
          waitingForNextLetter = true;
          setTimeout(nextLetter, 2000); // Wait 2 seconds before next letter
        }
      }
    } else {
      // Incorrect or no prediction - reset tracking
      lastPrediction = "";
      lastPredictionTime = null;
      if (prediction) {
        resultDisplay.textContent = "Try again";
      } else {
        resultDisplay.textContent = "";
      }
    }
  }

  // Start the demo
  async function startDemo() {
    const deviceId = cameraSelect.value;
    
    if (!deviceId) {
      alert("Please select a camera");
      return;
    }
    
    try {
      const success = await startCamera(deviceId);
      if (!success) throw new Error("Failed to start camera");
      
      // Start frame processing
      if (app.animationId) {
        cancelAnimationFrame(app.animationId);
      }
      app.animationId = requestAnimationFrame(processFrame);
      
      // Reset and start quiz
      currentLetterIndex = 0;
      demoActive = true;
      waitingForNextLetter = false;
      nextLetter();
      
      // Update buttons
      startButton.disabled = true;
      stopButton.disabled = false;
      cameraSelect.disabled = true;
    } catch (err) {
      console.error("Demo start error:", err);
      alert(`Error: ${err.message}`);
    }
  }
  
  // Stop the demo
  function stopDemo() {
    stopCamera();
    demoActive = false;
    
    // Update UI
    resultDisplay.textContent = "Demo stopped";
    predictionValueDisplay.textContent = "None";
    
    // Reset buttons
    startButton.disabled = false;
    stopButton.disabled = true;
    cameraSelect.disabled = false;
  }

  // Event Listeners
  document.addEventListener("signPrediction", (event) => {
    const { prediction } = event.detail;
    handlePrediction(prediction);
  });
  
  document.addEventListener("DOMContentLoaded", async function() {
    // Load available cameras
    try {
      await loadCameras(cameraSelect);
    } catch (err) {
      console.error("Camera loading error:", err);
      alert(`Error loading cameras: ${err.message}`);
    }
  });
  
  startButton.addEventListener("click", startDemo);
  stopButton.addEventListener("click", stopDemo);
  backButton.addEventListener("click", () => {
    stopCamera();
    window.location.href = "/";
  });

  // These functions use the global app functions from layout.html
  async function startCamera(deviceId) {
    if (typeof window.startCamera === 'function') {
      return await window.startCamera(deviceId);
    } else {
      // Fallback if global function isn't available
      try {
        if (app.stream) {
          app.stream.getTracks().forEach(track => track.stop());
        }
        
        const constraints = {
          video: { deviceId: { exact: deviceId } }
        };
        
        app.stream = await navigator.mediaDevices.getUserMedia(constraints);
        app.webcam = document.getElementById('webcam');
        
        if (app.webcam) {
          app.webcam.srcObject = app.stream;
          app.isStreaming = true;
          return true;
        }
        return false;
      } catch (err) {
        console.error("Camera start error:", err);
        return false;
      }
    }
  }
  
  function stopCamera() {
    if (typeof window.stopCamera === 'function') {
      return window.stopCamera();
    } else {
      // Fallback if global function isn't available
      try {
        if (app.stream) {
          app.stream.getTracks().forEach(track => track.stop());
          app.isStreaming = false;
          
          if (app.animationId) {
            cancelAnimationFrame(app.animationId);
            app.animationId = null;
          }
          
          if (app.ctx && app.videoCanvas) {
            app.ctx.clearRect(0, 0, app.videoCanvas.width, app.videoCanvas.height);
          }
          
          return true;
        }
        return false;
      } catch (err) {
        console.error("Camera stop error:", err);
        return false;
      }
    }
  }
  
  // Function to load available cameras
  async function loadCameras(selectElement) {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      
      // Clear options except the first one
      while (selectElement.options.length > 1) {
        selectElement.remove(1);
      }
      
      if (videoDevices.length === 0) {
        throw new Error("No cameras found on this device");
      }
      
      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Camera ${index + 1}`;
        selectElement.appendChild(option);
      });
      
      // If there's only one camera, select it automatically
      if (videoDevices.length === 1) {
        selectElement.selectedIndex = 1;
      }
      
      return true;
    } catch (error) {
      console.error("Camera enumeration error:", error);
      throw error;
    }
  }
</script>
{% endblock %}
